name: Build PicoBoot-WiFi

on: [push]

jobs:
  tests:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # The runners' DNS (Azure, 168.63.129.16) didn't resolve Ubuntu's package servers, so apt in the
      # image build found no packages (2026-11-11): Docker gets public resolvers, which the image build
      # uses too
      - name: Public DNS for Docker
        run: |
          echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # The same image as local builds (docker/Dockerfile): SDK 2.3.1, picotool 2.3.1, GCC 14.2
      - name: Build the build image
        run: docker build -t picoboot-wifi-build docker/

      - name: Build
        run: >
          docker run --rm -v "$PWD":/src -w /src picoboot-wifi-build
          sh -c 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel'

      - name: Check the layout
        run: >
          docker run --rm -v "$PWD":/src -w /src picoboot-wifi-build
          python3 tests/check_layout.py --loader build/src/loader/loader.elf --firmware build/src/firmware/firmware.elf

      # Test-build-only code (the test page) is compiled only when the version ends in -dev: compile it
      # from a copy marked so, without warnings (D47's L6, kept by D48). The crash and marked-blob test
      # builds of plan steps 3.7 and 3.8 are made locally when needed: -DPICOBOOT_WIFI_TEST_CRASH=startup
      # or after5s, -DPICOBOOT_WIFI_BLOB=marked (D48)
      - name: Compile a test build
        run: |
          docker run --rm -v "$PWD":/src -w /src picoboot-wifi-build sh -c '
            set -e
            cp -r /src /tmp/dev
            sed -i -E "s/set\(PICOBOOT_WIFI_VERSION \"([^\"]+)\"\)/set(PICOBOOT_WIFI_VERSION \"\1-dev\")/" /tmp/dev/CMakeLists.txt
            cmake -S /tmp/dev -B /tmp/dev/build-test -DCMAKE_BUILD_TYPE=Release > /tmp/configure.log
            cat /tmp/configure.log
            grep -q "test build: 1" /tmp/configure.log
            cmake --build /tmp/dev/build-test --parallel > /tmp/build.log 2>&1 || { cat /tmp/build.log; exit 1; }
            if grep "warning:" /tmp/build.log; then exit 1; fi
            python3 /tmp/dev/tests/check_layout.py --loader /tmp/dev/build-test/src/loader/loader.elf --firmware /tmp/dev/build-test/src/firmware/firmware.elf
          '

      # With a build directory, the PIO simulator tests (injection and counters) run too
      - name: Run all tests against the build
        env:
          PICOBOOT_BUILD_DIR: build
        run: python3 -m unittest discover -s tests -v

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: picoboot-wifi-${{ github.sha }}
          path: |
            build/picoboot-wifi-install.uf2
            build/picoboot-wifi-update.bin
            build/src/loader/loader.elf
            build/src/firmware/firmware.elf
